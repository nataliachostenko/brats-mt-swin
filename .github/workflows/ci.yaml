name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # CPU-only build: the runner has no GPU, and the default "torch" wheel
        # otherwise pulls several GB of nvidia-*-cuXX packages that don't fit
        # on the free runner's disk.
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        # monai[all] pulls itk/openslide/cucim/transformers/mlflow/clearml/...
        # none of which this repo uses; [nibabel] covers what LoadImaged needs.
        # einops is a lazy runtime dependency of SwinUNETR, not bundled by [nibabel].
        pip install lightning "monai[nibabel]" einops scipy hydra-core pytest flake8 scikit-learn

    - name: Lint with flake8
      run: flake8 src/ tools/ tests/

    - name: Run tests
      run: pytest tests/
