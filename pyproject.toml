[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brats-mgr"
version = "0.1.0"
description = "Evaluation and training pipeline for BraTS 2024 GLI segmentation using Multi-Task Swin UNETR"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Natalia Chostenko" }
]
dependencies = [
    "torch>=2.0.0",
    "lightning>=2.1.0",
    "monai[all]>=1.3.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.1.0",
    "wandb>=0.16.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "einops>=0.7.0",
    "nibabel>=5.0.1",
    "connected-components-3d>=3.12.1",
    "medpy>=0.5.2",
    "matplotlib>=3.5.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
    "flake8>=7.0.0",
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
