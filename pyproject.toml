[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brats-mgr"
version = "0.1.0"
description = "Evaluation and training pipeline for BraTS 2024 GLI segmentation using Multi-Task Swin UNETR"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Natalia Chostenko" }
]
dependencies = [
    "torch>=2.0.0",
    "lightning>=2.1.0",
    "monai[all]>=1.3.0",
    "hydra-core>=1.3.0",
    "omegaconf",
    "wandb",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "flake8"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
